name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned developer dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Install FFmpeg for media regression tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Ruff
        run: python -m ruff check shorts_generator web launcher.py main.py tests scripts

      - name: Mypy
        run: python -m mypy --strict

      - name: Bandit security lint
        run: python -m bandit -r shorts_generator web launcher.py main.py scripts -ll -x tests

      - name: Pytest
        # Keep the gate just below the current 53.25% measured total while
        # the dynamic provider/media adapters gain direct integration coverage.
        run: python -m pytest --cov=shorts_generator --cov=web --cov-report=term-missing --cov-fail-under=53

      - name: JavaScript syntax
        shell: bash
        run: for file in web/static/*.js web/static/modules/*.js; do node --check "$file"; done

      - name: Dependency audit
        run: |
          python -m pip_audit -r requirements.txt --progress-spinner off
          python -m pip_audit -r requirements-dev.txt --progress-spinner off
          python -m pip_audit -r requirements-local.txt --progress-spinner off
          python -m pip_audit -r requirements-gpu.txt --progress-spinner off
          python -m pip_audit -r requirements-docker.txt --progress-spinner off
          # arm64 was previously excluded because Pillow 12.2.0 had published
          # advisories and 12.3.0 lacked an aarch64 wheel; the wheel now exists
          # upstream and the manifest pins 12.3.0, so the manifest is audited
          # like the rest of the matrix. The arm64 dependency job below
          # continues to enforce binary availability for the target stack.
          python -m pip_audit -r requirements-docker-arm64.txt --progress-spinner off

      - name: Generate dependency SBOM
        run: python -m pip_audit -r requirements.txt --format cyclonedx-json --output sbom-requirements.json --progress-spinner off

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-python-${{ matrix.python-version }}
          path: sbom-requirements.json
          if-no-files-found: error

  windows-smoke:
    name: Windows packaged-runtime smoke
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install runtime and developer dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pyinstaller==6.22.2
      - name: Build packaged executable
        shell: pwsh
        run: |
          python -m pip install -r requirements-local.txt
          python scripts\build.py portable
      - name: API health smoke
        shell: pwsh
        run: |
          $env:SHORTS_STUDIO_HEADLESS = "true"
          $env:SHORTS_AUTO_RESUME = "false"
          $env:SHORTS_STUDIO_BROWSER = "1"
          $env:SHORTS_API_TOKEN = "ci-token"
          $env:SHORTS_STUDIO_DATA_DIR = "$PWD\.ci-data"
          $env:LOCAL_OUTPUT_DIR = "$PWD\.ci-data\output"
          $process = Start-Process "$PWD\dist\ShortsStudio\ShortsStudio.exe" -ArgumentList '--browser','--port','18761' -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 45; $i++) { try { Invoke-WebRequest http://127.0.0.1:18761/api/health -UseBasicParsing | Out-Null; $healthy = $true; break } catch { Start-Sleep -Seconds 1 } }
            if (-not $healthy) { throw "Packaged API did not become healthy" }
            $response = Invoke-WebRequest http://127.0.0.1:18761/api/health -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "Health check failed" }
            try {
              Invoke-WebRequest http://127.0.0.1:18761/api/system -UseBasicParsing | Out-Null
              throw "Authentication smoke failed: anonymous request was accepted"
            } catch {
              if (-not ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401)) { throw }
            }
            $authorized = Invoke-WebRequest http://127.0.0.1:18761/api/system -UseBasicParsing -Headers @{ Authorization = "Bearer ci-token" }
            if ($authorized.StatusCode -ne 200) { throw "Authenticated system smoke failed" }
            Invoke-WebRequest http://127.0.0.1:18761/api/shutdown -Method Post -UseBasicParsing -Headers @{ Authorization = "Bearer ci-token" } | Out-Null
            $process.WaitForExit(15000)
            $process.Refresh()
            if (-not $process.HasExited) { throw "Packaged process did not stop after shutdown" }
          } finally { $process.Refresh(); if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue } }

      - name: Verify packaged local speech evidence
        shell: pwsh
        run: python scripts/verify_v21.py --executable dist/ShortsStudio/ShortsStudio.exe --expected-version 2.1.0 --output release/v21-packaged-check.json

      - name: Verify package version source
        shell: pwsh
        run: |
          $version = python -c "from shorts_generator import __version__; print(__version__)"
          if ($version -ne "2.1.0") { throw "Unexpected package version: $version" }

  local-evidence:
    name: Real OCR and speech runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install local runtime and OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg tesseract-ocr tesseract-ocr-eng
          python -m pip install -r requirements-local.txt
      - name: Verify real evidence and authenticated lifecycle
        run: python scripts/verify_v21.py --require-ocr --expected-version 2.1.0 --output release/v21-source-check.json

  compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Compose file
        # SHORTS_API_TOKEN is required by the compose file (fail-closed
        # deployments), so supply a placeholder for validation only.
        run: docker compose --env-file .env.docker.example config --quiet
        env:
          SHORTS_API_TOKEN: ci-placeholder-token

  arm64-dependencies:
    name: Verify Linux arm64 CPU dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve manylinux arm64 wheels
        # The runtime image is Debian 12 bookworm (glibc 2.36), so every
        # manylinux glibc tier up to 2_36 is installable. Pillow 12.3.0 ships
        # aarch64 wheels as manylinux_2_27 (paired 2_27+2_28 tags), and OpenCV
        # ships 2_17; the 2_17 tier stays as the platform floor. Pip rejects
        # unknown platform tags, so only tiers with published tag names are
        # listed (manylinux_2_28 is a paired tag, not a standalone one).
        run: |
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: \
            --platform manylinux_2_17_aarch64 --platform manylinux_2_27_aarch64 \
            --implementation cp \
            --python-version 312 --abi cp312 \
            -r requirements-docker-arm64.txt --dest "$RUNNER_TEMP/shorts-arm64-wheels"
          test "$(find "$RUNNER_TEMP/shorts-arm64-wheels" -type f | wc -l)" -gt 0

  helm:
    name: Lint Helm deployment chart
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Lint and render chart
        run: |
          helm lint deploy/helm/shorts-studio
          helm template shorts-studio deploy/helm/shorts-studio --set image.tag=2.1.0 --set-string secretEnv.SHORTS_API_TOKEN=ci-placeholder-token >/tmp/shorts-studio.yaml
          grep -q 'kind: Deployment' /tmp/shorts-studio.yaml

  browser-e2e:
    name: Playwright creator flow and accessibility
    runs-on: ubuntu-latest
    env:
      RUN_BROWSER_E2E: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install browser test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt && python -m playwright install --with-deps chromium
      - name: Run browser tests
        run: python -m pytest -q tests/e2e

  docker-runtime:
    name: Docker runtime and non-root smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        run: docker build --tag shorts-studio:ci .
      - name: Start and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name shorts-studio-ci --publish 127.0.0.1:17860:7860 --env SHORTS_API_TOKEN=ci-token shorts-studio:ci
          trap 'docker stop shorts-studio-ci >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do curl --fail --silent http://127.0.0.1:17860/api/health >/dev/null && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:17860/api/health >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:17860/api/system)" = "401"
          curl --fail --silent -H 'Authorization: Bearer ci-token' http://127.0.0.1:17860/api/system >/dev/null
          test "$(docker exec shorts-studio-ci id -u)" != "0"
