name: Draft release notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    name: Update release draft
    runs-on: ubuntu-latest
    steps:
      - name: Draft release from changelog and PR labels
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
