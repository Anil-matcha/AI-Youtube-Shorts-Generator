image:
  repository: ghcr.io/wiifhub/shorts-studio
  tag: "0.11.3"
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 7860

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shorts-studio.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  enabled: true
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 20Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]

env:
  SHORTS_STUDIO_HEADLESS: "true"
  SHORTS_STUDIO_BROWSER: "true"
  SHORTS_RATE_LIMIT_BACKEND: "sqlite"
  SHORTS_RATE_LIMIT_STORE: "/data/rate_limits.sqlite3"

secretEnv: {}

nodeSelector: {}
tolerations: []
affinity: {}
