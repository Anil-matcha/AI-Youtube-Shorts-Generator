apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shorts-studio.fullname" . }}
  labels:
    {{- include "shorts-studio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "shorts-studio.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shorts-studio.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      containers:
        - name: shorts-studio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          envFrom:
            {{- if .Values.env }}
            - configMapRef:
                name: {{ include "shorts-studio.fullname" . }}
            {{- end }}
            {{- if .Values.secretEnv }}
            - secretRef:
                name: {{ include "shorts-studio.fullname" . }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "shorts-studio.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
