  <rect x="42" y="42" width="428" height="428" rx="104" fill="url(#accent)" opacity="0.94"/>
  <rect x="72" y="72" width="368" height="368" rx="82" fill="#091221" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
