  <path d="M347 151C321 128 278 118 238 123C191 129 159 156 159 193C159 235 196 249 249 263C310 279 352 295 352 337C352 383 307 408 251 408C207 408 163 392 136 367" fill="none" stroke="url(#ribbon)" stroke-width="38" stroke-linecap="round"/>
  <path d="M347 151C321 128 278 118 238 123C191 129 159 156 159 193C159 235 196 249 249 263C310 279 352 295 352 337C352 383 307 408 251 408C207 408 163 392 136 367" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="7" stroke-linecap="round"/>
